<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Leaderboard Discord Bot logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#404EED"/>
    </linearGradient>
    <linearGradient id="medal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#F4B740"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- symmetric Discord-style face, horizontally centered on x=120 -->
  <g fill="#ffffff">
    <!-- head/body silhouette (mirror-symmetric) -->
    <path d="M120 48
             C150 48 168 55 180 63
             C196 84 202 108 200 132
             C199 141 194 148 186 152
             C175 159 160 163 146 165
             L139 155
             C133 156 126 156.5 120 156.5
             C114 156.5 107 156 101 155
             L94 165
             C80 163 65 159 54 152
             C46 148 41 141 40 132
             C38 108 44 84 60 63
             C72 55 90 48 120 48 Z"/>
    <!-- eyes (symmetric around x=120) -->
    <ellipse cx="99"  cy="112" rx="11" ry="14" fill="#404EED"/>
    <ellipse cx="141" cy="112" rx="11" ry="14" fill="#404EED"/>
  </g>

  <!-- medal ribbon + disc, centered under the face -->
  <g>
    <path d="M108 158 L100 186 L120 176 L140 186 L132 158 Z" fill="#F04747"/>
    <circle cx="120" cy="190" r="26" fill="url(#medal)" stroke="#E0952B" stroke-width="2.5"/>
    <circle cx="120" cy="190" r="18" fill="none" stroke="#E0952B" stroke-width="1.5" opacity="0.6"/>
    <text x="120" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="bold" font-size="27" fill="#B4711A">1</text>
  </g>
</svg>
